name = "seb-exams"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Pages allowed to call /s/* (CORS). Local test origin included for the Playwright suite.
ALLOWED_ORIGINS = "https://chetools.github.io,http://localhost:8765"
APP_ORIGIN = "https://seb-exams.carloscomail.workers.dev"
# Secrets (wrangler secret put): MAIL_URL, MAIL_SECRET, ADMIN_EMAIL. Local dev: worker/.dev.vars (DEV = "1").

# Teacher app. Only these paths run code; everything else is served from ./public.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/auth/*", "/api/*", "/s/*", "/exam.seb"]

[[d1_databases]]
binding = "DB"
database_name = "seb-exams"
database_id = "a99d3036-239c-411b-99e7-e39fa6851b33"
