<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@@@KATEX_VERSION@@/dist/katex.min.css">
<style>@@CSS@@</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>@@TITLE@@</h1>
  <div class="sub" id="sub"></div>
</div></header>
<div class="bar hidden" id="bar"><div class="wrap">
  <span class="who" id="who"></span><span class="grow"></span>
  <span class="saved" id="saved"></span><span class="timer" id="timer">--:--</span>
</div></div>
<main><div class="wrap">
  <div id="msg"></div>
  <section id="start" class="card hidden">
    <div id="intro"></div>
    <div id="sebgate" class="msg warn hidden">
      This exam must be taken in <b>Safe Exam Browser</b>.
      <div class="row" style="margin-top:10px">
        <a class="btn" id="seblink" href="#">Open in Safe Exam Browser</a>
        <a class="btn secondary" id="sebfile" href="#" download>Download the .seb file</a>
      </div>
    </div>
    <form id="startform">
      <label class="field">Full name <input id="name" autocomplete="name" required maxlength="200"></label>
      <label class="field">Student ID <input id="sid" autocomplete="off" required maxlength="64"></label>
      <button id="startbtn" type="submit">Start the exam</button>
    </form>
  </section>
  <section id="exam" class="hidden">
    <div id="questions"></div>
    <div class="card"><div class="row">
      <button id="submitbtn" type="button">Submit exam</button>
      <span class="hint" id="answered"></span>
    </div></div>
  </section>
  <section id="done" class="card hidden">
    <div class="msg ok"><b>Submitted ✓</b> Your answers have been received.</div>
    <p>Your receipt code (keep it as proof of submission):</p>
    <p class="receipt" id="receipt"></p>
    <p><a class="btn" id="quit" href="#">Finish and quit Safe Exam Browser</a></p>
  </section>
</div></main>
<dialog id="confirm">
  <p id="confirmtext"></p>
  <div class="row"><button id="yes" type="button">Submit now</button>
  <button id="no" type="button" class="secondary">Keep working</button></div>
</dialog>
<script>window.EXAM = @@EXAM_JSON@@;</script>
<script>@@JS@@</script>
</body>
</html>
