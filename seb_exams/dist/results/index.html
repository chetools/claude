<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam results</title>
<meta name="robots" content="noindex">
<style>:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #1d2330; --muted: #5d6675; --line: #dde1e7;
  --accent: #1f5fae; --accent-ink: #ffffff; --ok: #237a45; --bad: #b3261e; --warn-bg: #fff6e0;
  --col: 46rem;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: var(--col); margin: 0 auto; padding: 0 16px; }
header.top { background: var(--card); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-top: 18px; padding-bottom: 14px; }
h1 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: .95rem; }
.bar { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding-top: 8px; padding-bottom: 8px; }
.bar .who { font-weight: 600; overflow-wrap: anywhere; }
.bar .grow { flex: 1; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; padding: 2px 10px; border-radius: 6px; background: #eef3fa; white-space: nowrap; }
.timer.low { background: #fde7e5; color: var(--bad); }
.saved { color: var(--muted); font-size: .85rem; white-space: nowrap; }
main { padding: 18px 0 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin: 0 0 16px; }
.card h2 { font-size: 1.05rem; margin: 0 0 10px; display: flex; gap: 10px; justify-content: space-between; }
.card h2 .pts { color: var(--muted); font-weight: 500; font-size: .9rem; white-space: nowrap; }
.section-title { font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; }
.q p { margin: 0 0 10px; }
.eq { overflow-x: auto; overflow-y: hidden; margin: 6px 0 12px; }
.figure { margin: 6px 0 14px; text-align: center; }
.figure svg { width: 100%; max-width: 480px; height: auto; }
.opts { display: grid; gap: 8px; margin-top: 6px; }
.opt { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.opt:hover { border-color: #b8c3d3; }
.opt input { margin: 0; flex: none; width: 18px; height: 18px; }
.opt.sel { border-color: var(--accent); background: #f1f6fd; }
.opt .lab { overflow-x: auto; }
input.blank { font: inherit; width: 11em; max-width: 100%; padding: 2px 6px; border: 0; border-bottom: 2px solid var(--accent); background: #f4f7fb; }
input.blank:focus { outline: 2px solid #9bbbe6; }
.hint { color: var(--muted); font-size: .9rem; }
textarea { width: 100%; min-height: 12em; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
.count { color: var(--muted); font-size: .85rem; text-align: right; }
label.field { display: block; margin: 0 0 12px; font-weight: 600; }
label.field input { display: block; width: 100%; margin-top: 4px; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-weight: 400; }
button, .btn { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink); text-decoration: none; display: inline-block; }
button.secondary, .btn.secondary { background: #e7ecf3; color: var(--ink); }
button:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.msg { border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; }
.msg.err { background: #fdecea; color: var(--bad); }
.msg.warn { background: var(--warn-bg); }
.msg.ok { background: #e7f5ec; color: var(--ok); }
.receipt { font: 700 1.6rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
dialog { border: 1px solid var(--line); border-radius: 10px; max-width: min(30rem, calc(100vw - 32px)); }
.hidden { display: none !important; }
/* results page */
.wide { --col: 100rem; }
.tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; font-size: .9rem; min-width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: #f0f3f7; position: sticky; top: 0; white-space: nowrap; }
td.ok { color: var(--ok); } td.bad { color: var(--bad); }
td .open { max-width: 28em; white-space: pre-wrap; max-height: 6.5em; overflow: hidden; cursor: pointer; }
td .open.full { max-height: none; }
details.key { margin: 0 0 16px; } details.key pre { white-space: pre-wrap; }
#table td:nth-child(2), #table td:nth-child(3), #table td:nth-child(5) { white-space: nowrap; }
</style>
</head>
<body class="wide">
<header class="top"><div class="wrap">
  <h1>Exam results</h1>
  <div class="sub">Teacher view. Multiple-choice and fill-in-the-blank questions are graded automatically; open questions are listed for manual grading.</div>
</div></header>
<main><div class="wrap">
  <div id="msg"></div>
  <form id="login" class="card row">
    <label class="field" style="flex:1;min-width:14em;margin:0">Teacher password <input id="pw" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <div id="pick" class="card row hidden">
    <label class="field" style="margin:0;min-width:0;max-width:100%">Exam <select id="exam" style="font:inherit;padding:6px;max-width:100%"></select></label>
    <button id="reload" type="button" class="secondary">Refresh</button>
    <button id="csv" type="button">Download CSV</button>
    <span class="hint" id="count"></span>
  </div>
  <details class="key hidden card" id="keybox"><summary>Answer key and model answers</summary><div id="key"></div></details>
  <div class="tablewrap hidden" id="tablewrap"><table id="table"></table></div>
</div></main>
<script>window.API = "https://seb-exams.carloscomail.workers.dev";</script>
<script>// Teacher results page: lists submissions from the Worker and exports them as CSV.
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  let pw = "", data = null;
  try { pw = sessionStorage.getItem("sebexam:pw") || ""; } catch (e) { /* storage blocked */ }

  function message(text, kind) {
    $("msg").innerHTML = text ? '<div class="msg ' + (kind || "err") + '"></div>' : "";
    if (text) $("msg").firstChild.textContent = text;
  }

  async function get(path) {
    const r = await fetch(window.API + path, { headers: { Authorization: "Bearer " + pw } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Error " + r.status);
    return d;
  }

  async function signIn(ev) {
    if (ev) ev.preventDefault();
    if (ev) pw = $("pw").value;
    try {
      const exams = await get("/exams");
      try { sessionStorage.setItem("sebexam:pw", pw); } catch (e) { /* ignore */ }
      $("exam").innerHTML = "";
      for (const e of exams) {
        const o = document.createElement("option");
        o.value = e.id;
        o.textContent = e.title + " (" + e.id + ")";
        $("exam").appendChild(o);
      }
      const want = new URLSearchParams(location.search).get("exam");
      if (want) $("exam").value = want;
      $("login").classList.add("hidden");
      $("pick").classList.remove("hidden");
      message("");
      if (exams.length) await loadExam(); else message("No exams in the database yet.", "warn");
    } catch (e) {
      message(e.message);
      $("login").classList.remove("hidden");
    }
  }

  const optLetter = (q, id) => { const i = q.options.findIndex((o) => o.id === id); return i < 0 ? "" : String.fromCharCode(65 + i); };

  function cell(q, s) {
    const a = s.answers[q.id] || "";
    const d = s.detail[q.id];
    if (q.type === "mc") return { text: optLetter(q, a), cls: d && d.ok ? "ok" : "bad" };
    if (q.type === "fill") return { text: a, cls: d && d.ok ? "ok" : "bad" };
    return { text: a, cls: "", open: true };
  }

  function columns() {
    return ["Name", "Student ID", "Submitted (UTC)", "Minutes used", "Auto score"].concat(
      data.questions.map((q) => q.id + " [" + q.type + ", " + q.points + "]"), ["Receipt", "SEB check"]);
  }

  function rowValues(s) {
    const used = s.started_at ? ((Date.parse(s.submitted_at) - Date.parse(s.started_at)) / 60000).toFixed(1) : "";
    return [s.name, s.student_id, s.submitted_at.replace("T", " ").slice(0, 19), used,
      s.auto_score + " / " + s.auto_max + (s.manual_max ? " (+" + s.manual_max + " manual)" : "")]
      .concat(data.questions.map((q) => cell(q, s)), [s.receipt, s.seb_check]);
  }

  function renderKey() {
    const box = $("key");
    box.innerHTML = "";
    for (const q of data.questions) {
      const h = document.createElement("h3");
      h.textContent = q.id + " (" + q.type + ", " + q.points + " points)";
      const p = document.createElement("pre");
      if (q.type === "mc") p.textContent = q.options.map((o, i) => String.fromCharCode(65 + i) + (o.id === q.correct ? " ✓ " : "   ") + o.text).join("\n");
      else if (q.type === "fill") p.textContent = "Accepted: " + q.answers.join(", ");
      else p.textContent = q.model_answer || "(no model answer)";
      box.append(h, p);
    }
    $("keybox").classList.remove("hidden");
  }

  async function loadExam() {
    try {
      data = await get("/results?exam=" + encodeURIComponent($("exam").value));
    } catch (e) { return message(e.message); }
    renderKey();
    const t = $("table");
    t.innerHTML = "";
    const head = t.createTHead().insertRow();
    for (const c of columns()) { const th = document.createElement("th"); th.textContent = c; head.appendChild(th); }
    const body = t.createTBody();
    for (const s of data.submissions) {
      const tr = body.insertRow();
      for (const v of rowValues(s)) {
        const td = tr.insertCell();
        const val = typeof v === "object" && v !== null ? v : { text: v };
        if (val.cls) td.className = val.cls;
        if (val.open) {
          const div = document.createElement("div");
          div.className = "open";
          div.title = "Click to expand";
          div.textContent = val.text;
          div.addEventListener("click", () => div.classList.toggle("full"));
          td.appendChild(div);
        } else td.textContent = val.text;
      }
    }
    $("count").textContent = data.submissions.length + (data.submissions.length === 1 ? " submission" : " submissions");
    $("tablewrap").classList.remove("hidden");
  }

  function csv() {
    if (!data) return;
    const esc = (v) => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const cols = columns().concat(data.questions.filter((q) => q.type !== "open").map((q) => q.id + " points"));
    const lines = [cols.map(esc).join(",")];
    for (const s of data.submissions) {
      const vals = rowValues(s).map((v) => (typeof v === "object" && v !== null ? v.text : v))
        .concat(data.questions.filter((q) => q.type !== "open").map((q) => (s.detail[q.id] || {}).points ?? ""));
      lines.push(vals.map(esc).join(","));
    }
    const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = data.exam.id + "-results.csv";
    a.click();
  }

  $("login").addEventListener("submit", signIn);
  $("exam").addEventListener("change", loadExam);
  $("reload").addEventListener("click", loadExam);
  $("csv").addEventListener("click", csv);
  if (pw) signIn();
})();
</script>
</body>
</html>
