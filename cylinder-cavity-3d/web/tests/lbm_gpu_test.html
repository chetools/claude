<!doctype html>
<meta charset="utf-8"><title>lbm gpu test</title>
<body><pre id="out">running...</pre>
<script src="../lbm_cpu.js"></script>
<script src="../lbm_gpu.js"></script>
<script>
// GPU (f32) vs CPU (f64) vs numpy reference.  Results in window.RESULT (JSON) and #out.
const L = CC3.lbm;
const q = new URLSearchParams(location.search);
function maxRel(a, b) { let m = 0, d = 0; for (let i = 0; i < a.length; i++) { m = Math.max(m, Math.abs(b[i])); d = Math.max(d, Math.abs(a[i] - b[i])); } return d / m; }
(async () => {
  const R = { errors: [] };
  try {
    const wgsl = await (await fetch("../lbm.wgsl")).text();
    const ref = await (await fetch("lbm_ref.json")).json();
    const device = await L.requestGpuDevice();
    device.addEventListener && device.lost.then(i => R.errors.push("device lost " + i.message));
    R.limits = { maxStorageBufferBindingSize: device.limits.maxStorageBufferBindingSize, maxBufferSize: device.limits.maxBufferSize };
    const gf = p => L.createGpuSolver(device, p, { wgsl });
    // 1. self-test rows, GPU and CPU
    R.rowsGpu = await L.selftest(gf, ref, { tol: 5e-3 });
    R.rowsCpu = await L.selftest(async p => new L.CpuSolver(p), ref);
    // 2. GPU vs CPU, whole fields
    R.fields = [];
    for (const cs of ref.cases) {
      const p = L.makeParams(cs.inp), g = await gf(p), c = new L.CpuSolver(p);
      await g.step(cs.steps); c.step(cs.steps);
      const ug = await g.readVelocity(), uc = c.velocity();
      const tg = await g.readTorque();
      R.fields.push({ case: cs.inp.Nz + " " + cs.inp.span + " " + cs.inp.collision, velRel: maxRel(ug, uc),
        torqueRel: Math.abs(tg - c.torque()) / Math.abs(c.torque()), massGpu: await g.mass(), massCpu: c.mass() });
      g.destroy();
    }
    // 3. spanwise uniformity with seed = 0 (periodic span; orbit + spin so refill and links run)
    R.uniform = [];
    for (const [N, Nz, col, steps] of [[16, 4, "reg", 150], [32, 8, "mrt", 100], [16, 2, "bgk", 100]]) {
      const p = L.makeParams({ N, Nz, Re: 100, Us: 0.5, Uo: 1.0, u_lb: 0.1, seed: 0, collision: col, span: "periodic" });
      const g = await gf(p), c = new L.CpuSolver(p);
      await g.step(steps); c.step(steps);
      const ug = await g.readVelocity(), uc = c.velocity(), pl = N * N, vol = Nz * pl;
      let dg = 0, dc = 0, mx = 0, wmax = 0;
      for (let comp = 0; comp < 3; comp++) for (let k = 1; k < Nz; k++) for (let n = 0; n < pl; n++) {
        dg = Math.max(dg, Math.abs(ug[comp * vol + k * pl + n] - ug[comp * vol + n]));
        dc = Math.max(dc, Math.abs(uc[comp * vol + k * pl + n] - uc[comp * vol + n])); }
      for (let n = 0; n < 3 * vol; n++) mx = Math.max(mx, Math.abs(ug[n]));
      for (let n = 2 * vol; n < 3 * vol; n++) wmax = Math.max(wmax, Math.abs(ug[n]));
      R.uniform.push({ N, Nz, col, steps, maxPlaneDiffGpu: dg, maxPlaneDiffCpu: dc, maxAbsVelocity: mx, maxAbsW: wmax });
      g.destroy();
    }
    // 4. buffer limits: the device above has the adapter maximum; test also a default-limits device
    const dd = await (await navigator.gpu.requestAdapter()).requestDevice();
    R.defaultLimits = { maxStorageBufferBindingSize: dd.limits.maxStorageBufferBindingSize, maxBufferSize: dd.limits.maxBufferSize };
    try { await L.createGpuSolver(dd, L.makeParams({ N: 128, Nz: 128 }), { wgsl }); R.limitMsg = "NO ERROR"; } catch (e) { R.limitMsg = e.message; }
    R.maxNz128Default = L.maxNzGpu(dd, 128);
    if (q.get("big")) {   // 128 x 128 x 64 on the default-limits device: allocation + 2 steps
      const gb = await L.createGpuSolver(dd, L.makeParams({ N: 128, Nz: 64, Uo: 0.5 }), { wgsl });
      const t0 = performance.now(); await gb.step(2); const u = await gb.readVelocity();
      let fin = true; for (let i = 0; i < u.length; i += 997) if (!isFinite(u[i])) fin = false;
      R.big = { bytesPerBuffer: L.gpuBytesPerPopulationBuffer(gb.params), finite: fin, ms2steps: performance.now() - t0 };
      gb.destroy();
    }
    dd.destroy();
    // 5. timing (information only)
    const N = +(q.get("N") || 32), Nz = +(q.get("Nz") || 16);
    const p = L.makeParams({ N, Nz, Re: 200, Us: 1, Uo: 0.5 }), g = await gf(p);
    await g.step(4);
    const t0 = performance.now(); await g.step(20); const t1 = performance.now();
    R.timing = { N, Nz, steps: 20, msPerStep: (t1 - t0) / 20 };
    const c = new L.CpuSolver(p); c.step(1); const t2 = performance.now(); c.step(5); R.timing.cpuMsPerStep = (performance.now() - t2) / 5;
    g.destroy();
  } catch (e) { R.errors.push(String(e && e.stack || e)); }
  window.RESULT = R;
  document.getElementById("out").textContent = JSON.stringify(R, null, 1);
  document.title = "done";
})();
</script>
